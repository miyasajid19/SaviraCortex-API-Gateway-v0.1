[project]
name = "api-gateway"
version = "1.0.0"
description = "Savare Cortex API Gateway for Jina with Redis-backed key rotation and failover"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic>=2.8,<3",
    "python-dotenv>=1.0,<2",
    "redis>=5.0,<7",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<2",
]
